<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animelore — 移动端 UI 原型</title>
  <style>
    :root {
      --bg:      oklch(11% 0.012 70);
      --surface: oklch(15% 0.014 70);
      --fg:      oklch(92% 0.006 95);
      --muted:   oklch(55% 0.012 70);
      --border:  oklch(24% 0.014 70);
      --accent:  oklch(52% 0.10 28);
      --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono: ui-monospace, 'IBM Plex Mono', Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      line-height: 1.5;
    }
    .launcher {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }
    .launcher-head {
      text-align: center;
      margin-bottom: 48px;
    }
    .launcher-head h1 {
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 400;
      margin-bottom: 8px;
    }
    .launcher-head p {
      color: var(--muted);
      font-size: 15px;
      max-width: 560px;
      margin: 0 auto 16px;
    }
    .launcher-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      justify-content: center;
      align-items: flex-start;
    }
    .screen-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .screen-label {
      font-family: var(--font-display);
      font-size: 1.125rem;
    }
    .screen-desc {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      max-width: 390px;
      margin-top: -8px;
    }
    .screen-block iframe {
      border: 0;
      display: block;
    }
    .direct-links {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    .direct-links p {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .link-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .link-row a {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      border: 1px solid color-mix(in oklch, var(--accent) 35%, var(--border));
      padding: 8px 14px;
      transition: background .15s;
    }
    .link-row a:hover {
      background: color-mix(in oklch, var(--accent) 10%, transparent);
    }
    @media (max-width: 860px) {
      .gallery { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="launcher">
    <header class="launcher-head">
      <p class="launcher-meta">Animelore · Mobile UI · Hi-Fi</p>
      <h1>作品档案馆 · 移动端原型</h1>
      <p>Editorial-monocle 字体气质 × 深色档案感。两屏完整交互：搜索首页 + EVA 四卡档案页（滑动切卡、换一批角度、AI 半屏抽屉）。</p>
    </header>

    <div class="gallery">
      <div class="screen-block">
        <h2 class="screen-label">首页 / 搜索</h2>
        <p class="screen-desc">品牌头部 · 搜索框 · 今日冷知识 · 今日漫游 · 最近打开</p>
        <iframe
          src="frames/iphone-15-pro.html?screen=../screens/home.html"
          width="390"
          height="844"
          loading="lazy"
          title="Animelore 首页"
        ></iframe>
      </div>
      <div class="screen-block">
        <h2 class="screen-label">作品档案页</h2>
        <p class="screen-desc">2×2 索引 · 大卡阅读 · 左右滑动 · 换一批角度 · AI 浮窗 · 下一份档案</p>
        <iframe
          src="frames/iphone-15-pro.html?screen=../screens/work-dossier.html"
          width="390"
          height="844"
          loading="lazy"
          title="Animelore 作品档案"
        ></iframe>
      </div>
    </div>

    <div class="direct-links">
      <p>直接打开单屏（无设备框）</p>
      <div class="link-row">
        <a href="screens/home.html">首页</a>
        <a href="screens/work-dossier.html">作品档案 · EVA</a>
      </div>
    </div>
  </div>
</body>
</html>
