<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iPhone 15 Pro Frame</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0a0a0c; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    .device {
      width: 390px;
      height: 844px;
      background: #111;
      border-radius: 48px;
      padding: 12px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.08),
        0 24px 80px rgba(0,0,0,.55);
      position: relative;
    }
    .screen-wrap {
      width: 100%;
      height: 100%;
      border-radius: 38px;
      overflow: hidden;
      background: #000;
      position: relative;
    }
    .island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 36px;
      background: #000;
      border-radius: 20px;
      z-index: 10;
      pointer-events: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }
    .home-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: rgba(255,255,255,.35);
      border-radius: 3px;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="device">
    <div class="screen-wrap">
      <div class="island" aria-hidden="true"></div>
      <iframe id="screen" title="App screen"></iframe>
      <div class="home-bar" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const screen = params.get('screen');
    if (screen) document.getElementById('screen').src = screen;
  </script>
</body>
</html>
